# /etc/nginx/conf.d/aztu.alakbaroff.com.conf
#
#   aztu.alakbaroff.com -> frontend (127.0.0.1:3004)
#
# Uses the same certificate as converter.alakbaroff.com (live/alakbaroff.com).

server {
    listen 80;
    listen [::]:80;
    server_name aztu.alakbaroff.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aztu.alakbaroff.com;

    ssl_certificate     /etc/letsencrypt/live/alakbaroff.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alakbaroff.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    access_log /var/log/nginx/aztu.alakbaroff.com.access.log;
    error_log  /var/log/nginx/aztu.alakbaroff.com.error.log;
}
